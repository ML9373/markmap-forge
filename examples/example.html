<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Strategic Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg-color: #eef1f5;
    --menu-bg: rgba(255,255,255,0.92);
    --menu-border: #d7dee6;
    --text-color: #29354a;
    --btn-bg: #ffffff;
    --btn-border: #ccd5e0;
    --btn-hover-bg: #f2f5f9;
    --btn-active-bg: #b3551f;
    --btn-active-text: #fff7f0;
    --node-text-color: #1c2534;
    --search-highlight: #f4c690;
    --badge-color: #6b7889;
    --root-color: #b3551f;
  }
  body[data-theme="dark"] {
    --bg-color: #10151d;
    --menu-bg: rgba(23,31,43,0.92);
    --menu-border: #2a3547;
    --text-color: #dbe3ee;
    --btn-bg: #171f2b;
    --btn-border: #2a3547;
    --btn-hover-bg: #202b3a;
    --btn-active-bg: #e0793a;
    --btn-active-text: #1a0f08;
    --node-text-color: #e8edf3;
    --search-highlight: #a85f22;
    --badge-color: #7c8aa0;
    --root-color: #e0793a;
  }
  body {
    margin:0; padding:0; overflow:hidden; background-color: var(--bg-color); transition: background-color .2s ease;
    font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  svg.markmap { width:100vw; height:100vh; }

  /* markmap injects its own stylesheet at runtime (loadCSS); #markmap beats its .markmap
     class rule on specificity alone, so these custom-property + presentation-attribute
     overrides win regardless of script load order. */
  #markmap {
    --mm-font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mm-font-size: 15.5px;
    --markmap-font: 400 var(--mm-font-size)/1.55 var(--mm-font-family);
    --markmap-text-color: var(--node-text-color);
    --markmap-a-color: var(--root-color);
    --markmap-a-hover-color: var(--root-color);
    --markmap-code-bg: rgba(179,85,31,0.1);
    --markmap-code-color: var(--root-color);
    --markmap-highlight-bg: var(--search-highlight);
    --markmap-highlight-node-bg: rgba(179,85,31,0.16);
    --markmap-circle-open-bg: var(--bg-color);
  }
  body[data-theme="dark"] #markmap { --markmap-code-bg: rgba(224,121,58,0.14); }
  #markmap path.markmap-link { stroke-opacity: 0.75; stroke-width: 1.6px !important; }
  #markmap g.markmap-node > circle { stroke-width: 1.6px !important; }
  #markmap g.markmap-node > .markmap-foreign strong { color: var(--root-color); }
  .markmap-node .markmap-foreign, .markmap-node .markmap-foreign * { color: var(--node-text-color) !important; }

  .menu-left {
    position: fixed; top: 20px; left: 20px; z-index: 100; display: flex; flex-direction: column; gap: 7px; max-width: 48vw;
    background: var(--menu-bg); padding: 9px 13px; border-radius: 10px; box-shadow: 0 8px 24px rgba(20,30,45,0.12);
    border: 1px solid var(--menu-border); backdrop-filter: blur(10px);
  }
  .menu-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .menu-right {
    position: fixed; top: 20px; right: 20px; z-index: 100; display: flex; flex-wrap: wrap; gap: 6px; max-width: 46vw;
    background: var(--menu-bg); padding: 9px 13px; border-radius: 10px; box-shadow: 0 8px 24px rgba(20,30,45,0.12);
    border: 1px solid var(--menu-border); backdrop-filter: blur(10px); align-items: center;
  }
  button, select, input[type="text"] {
    cursor:pointer; padding:6px 11px; border:1px solid var(--btn-border); background: var(--btn-bg);
    border-radius:6px; font-family: inherit; font-size:12px; font-weight:600; color: var(--text-color); transition: all .15s ease; outline:none;
  }
  input[type="text"] { cursor:text; font-weight:400; min-width:120px; }
  button:hover, select:hover { background: var(--btn-hover-bg); border-color: var(--root-color); }
  button:active { filter: brightness(0.95); }
  button.active { background: var(--btn-active-bg); color: var(--btn-active-text); border-color: var(--btn-active-bg); }
  .search-wrap { display:flex; align-items:center; gap:4px; }
  .search-count { font-family: "JetBrains Mono", monospace; font-size:11px; color: var(--badge-color); min-width:36px; text-align:center; }
  .search-match { background: var(--search-highlight); border-radius: 3px; }
  #version-badge {
    position:fixed; bottom:12px; left:16px; z-index:90; font-family: "JetBrains Mono", monospace; font-size:11px; letter-spacing:0.01em; color: var(--badge-color);
    background: var(--menu-bg); padding:5px 9px; border-radius:6px; border:1px solid var(--menu-border);
    pointer-events:none; max-width:60vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  body.animate-links .markmap-link { stroke-dasharray: 4 6; animation: mm-flow 0.6s linear infinite; }
  @keyframes mm-flow { to { stroke-dashoffset: -10; } }
  #hamburger { display:none; }
  @media (max-width: 700px) {
    .menu-left, .menu-right { display:none; max-width: 92vw; }
    .menu-left.mobile-open, .menu-right.mobile-open { display:flex; flex-direction:column; align-items:stretch; }
    .menu-left.mobile-open { top:70px; }
    .menu-right.mobile-open { top:auto; bottom:20px; right:20px; }
    #hamburger { display:block; position:fixed; top:20px; right:20px; z-index:110; font-size:16px; padding:8px 12px; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-lib"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-view"></script>
</head>
<body>

<button id="hamburger" onclick="toggleMobileMenu()">☰</button>

<div class="menu-left" id="menu">
  <div class="menu-row">
    <button onclick="window.safeFit()">Fit Window</button>
    <button id="btn-expand" onclick="expandAll()">Expand All</button>
    <button id="btn-collapse" onclick="collapseAll()">Collapse All</button>
    <div class="search-wrap">
      <input type="text" id="search-input" placeholder="Search... (Ctrl+F)" oninput="onSearchInput()" onkeydown="onSearchKeydown(event)">
      <span class="search-count" id="search-count"></span>
    </div>
  </div>
  <div class="menu-row" id="levels-container">
    <!-- Level 1..N buttons placed on line 2 -->
  </div>
</div>

<div class="menu-right" id="tools-menu">
  <button onclick="togglePitchMode()" id="btn-pitch" title="Pitch Mode: Focus & Zoom fit on expanded nodes">📺 Pitch Mode</button>
  <button onclick="toggleAutoFit()" id="btn-autofit" title="Toggle AutoFit on node click">🔄 AutoFit: OFF</button>
  <select onchange="changeNodeWidth(this.value)" title="Adjust Node Text Max Width" id="width-select">
    <option value="300">Width: 300px</option>
    <option value="400" selected>Width: 400px</option>
    <option value="600">Width: 600px</option>
  </select>
  <select onchange="changePalette(this.value)" title="Branch color palette" id="palette-select">
    <option value="sienna" selected>Palette: Sienna</option>
    <option value="ocean">Palette: Ocean</option>
    <option value="sunset">Palette: Sunset</option>
    <option value="forest">Palette: Forest</option>
    <option value="slate">Palette: Slate</option>
  </select>
  <select onchange="changeFont(this.value)" title="Node text typeface" id="font-select">
    <option value="source-sans" selected>Font: Source Sans</option>
    <option value="ibm-plex">Font: IBM Plex Sans</option>
    <option value="jetbrains-mono">Font: JetBrains Mono</option>
    <option value="georgia">Font: Georgia</option>
    <option value="system">Font: System UI</option>
  </select>
  <select onchange="changeFontSize(this.value)" title="Node text size" id="fontsize-select">
    <option value="s">Size: S</option>
    <option value="m" selected>Size: M</option>
    <option value="l">Size: L</option>
    <option value="xl">Size: XL</option>
  </select>
  <button onclick="toggleTheme()" id="btn-theme" title="Toggle dark mode">🌙 Dark</button>
  <button onclick="toggleLinkAnimation()" id="btn-flow" title="Decorative animated flow along branches (visual only, not a data-flow direction)">〰️ Animate</button>
  <button onclick="exportSVG()" title="Export current map as SVG">⬇ SVG</button>
  <button onclick="exportPNG()" title="Export high-resolution PNG image">🖼️ PNG</button>
</div>

<div id="version-badge">syd-markmap-forge · 2026-08-29</div>

<svg class="markmap" id="markmap"></svg>

<script>
const markdown = `
# Syd Markmap Forge
## Problem
### Prior approach
- One giant one-shot prompt asked an LLM to hand-reproduce 500 lines of HTML, CSS and JS verbatim on every run
- **Risk**: verbatim template fidelity depended on the LLM, not on code
- **Risk**: an unescaped backtick or a dollar-brace sequence in the source content could silently break the embedded script
### What changed
- The HTML, CSS and JS template is now a static asset, injected by deterministic code
- The agent's only job is producing a small typed JSON object, not thousands of characters of markup
## Architecture
### Typed input
- **schema_version**: fixed at 1
- **source_name**: human-readable title of the original document
- **generation_date**: authored explicitly, never resolved implicitly, so a delivered artifact is reproducible from its JSON source
- **markdown**: the sanitized outline, using heading levels for pillars and entities and bullets for detail
### Deterministic pipeline
- **validate**: schema shape plus markdown structural rules
- **render**: injects the validated content into the fixed template
- **deliver**: validates, renders, and reports a SHA-256 receipt for both the JSON source and the HTML artifact
## Validation rules
### Structural
- Exactly one H1 title line
- No heading-level skips
- No Markdown tables
### Safety
- Stray arrows and pipe glyphs are rejected
- Backticks and dollar-brace sequences are auto-escaped before they reach the embedded script
## Output features
### Inherited from the original template
- Live search with match count and Ctrl+F
- Dark and light themes with persisted state
- SVG export
- Pitch mode with fullscreen focus-and-zoom
- One expand button per detected heading depth
### Borrowed from archify
- PNG export: a full-resolution, high-DPI (2x) raster of the whole map, distinct from the raw SVG export
- Decorative animated links: a subtle flowing dash along branches, purely visual, not a data-flow direction
## Retired features
### Guided tour and minimap
- Both were ported from archify, then iterated on across several sessions to fix real bugs (fold-depth calibration, focal-node highlighting, a fixed-position panel hiding tree content, a minimap that painted its own viewport highlight over its node markers)
- Despite that investment, they never worked reliably enough — removed 2026-08-30 rather than continuing to sink effort into them

`;

const { Markmap, loadCSS, loadJS, Transformer } = window.markmap;
const transformer = new Transformer();
const { root, features } = transformer.transform(markdown);
const { styles, scripts } = transformer.getUsedAssets(features);
if (styles) loadCSS(styles);
if (scripts) loadJS(scripts, { getMarkmap: () => window.markmap });

let isPitchMode = false;
let autoFitEnabled = false;
let currentTheme = 'light';
let currentLevel = 2;
let searchMatches = [];
let searchIndex = -1;
let linkAnimation = false;
let currentPalette = 'sienna';
let currentFont = 'source-sans';
let currentFontSize = 'm';

// Curated harmonious palettes (in place of markmap's default d3.schemeCategory10 rainbow) —
// each keeps per-branch color tracing useful without a random clip-art-primary-colors look.
const PALETTES = {
    sienna: ['#b3551f', '#4a6fa5', '#3f7d5c', '#a37f2c', '#7d5ba6', '#3f8a8b'],
    ocean:  ['#0f6fb0', '#1a8f8f', '#2e7d5c', '#3b5b92', '#0e8a7a', '#5b7fa6'],
    sunset: ['#c1440e', '#d9822b', '#a83f5c', '#7d3c98', '#c2185b', '#e0793a'],
    forest: ['#2f5d3a', '#5c7a3f', '#7d6b3f', '#3f6b52', '#8a6d3f', '#4f7d4f'],
    slate:  ['#2c3e50', '#3d5a80', '#5b7ba6', '#7d9cbd', '#98b4d4', '#b8cbe0'],
};
const FONT_STACKS = {
    'source-sans':    `"Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif`,
    'ibm-plex':       `"IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif`,
    'jetbrains-mono': `"JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace`,
    georgia:          `Georgia, "Times New Roman", serif`,
    system:           `-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif`,
};
const FONT_SIZES = { s: '14px', m: '15.5px', l: '18px', xl: '21px' };

window.mm = Markmap.create('#markmap', { autoFit: false, maxWidth: 400, color: d3.scaleOrdinal(PALETTES[currentPalette]) }, root);

window.changePalette = function(name) {
    currentPalette = PALETTES[name] ? name : 'sienna';
    window.mm.setOptions({ color: d3.scaleOrdinal(PALETTES[currentPalette]) });
    window.mm.setData(root);
    saveState();
};

window.changeFont = function(key) {
    currentFont = FONT_STACKS[key] ? key : 'source-sans';
    document.getElementById('markmap').style.setProperty('--mm-font-family', FONT_STACKS[currentFont]);
    saveState();
};

window.changeFontSize = function(key) {
    currentFontSize = FONT_SIZES[key] ? key : 'm';
    document.getElementById('markmap').style.setProperty('--mm-font-size', FONT_SIZES[currentFontSize]);
    saveState();
};

// After a fit, the tree can render directly underneath the floating menu panels (both
// position:fixed, with no built-in collision avoidance). Nudge the pan so the topmost node
// clears the menus.
function adjustForOverlap() {
    try {
        const svg = document.getElementById('markmap');
        const menuLeft = document.querySelector('.menu-left').getBoundingClientRect();
        const menuRight = document.querySelector('.menu-right').getBoundingClientRect();
        const nodeEls = Array.from(document.querySelectorAll('#markmap g.markmap-node .markmap-foreign'));
        if (!nodeEls.length) return;

        const rects = nodeEls.map(el => el.getBoundingClientRect());
        const reservedTop = Math.max(menuLeft.bottom, menuRight.bottom) + 16;
        const topMost = Math.min(...rects.map(r => r.top));
        const dy = topMost < reservedTop ? reservedTop - topMost : 0;

        if (dy) {
            const transform = d3.zoomTransform(svg);
            const newTransform = d3.zoomIdentity.translate(transform.x, transform.y + dy).scale(transform.k);
            d3.select(svg).call(window.mm.zoom.transform, newTransform);
        }
    } catch (e) { /* non-critical */ }
}
window.safeFit = function() {
    const svg = document.getElementById('markmap');
    const before = d3.zoomTransform(svg);
    const beforeKey = before.x.toFixed(2) + ',' + before.y.toFixed(2) + ',' + before.k.toFixed(4);
    window.mm.fit();
    // markmap's fit() animates the pan/zoom over an unknown duration, starting on its own next
    // frame/tick. Sampling the transform mid-transition (or before it has even started, which
    // looks just as "stable") would compute the overlap nudge from a stale position. Poll until
    // the transform has actually moved away from its pre-fit value, then stops changing for a
    // few consecutive frames, before correcting it once, fully settled.
    let lastKey = beforeKey, stableFrames = 0, totalFrames = 0, hasMoved = false;
    function poll() {
        const t = d3.zoomTransform(svg);
        const key = t.x.toFixed(2) + ',' + t.y.toFixed(2) + ',' + t.k.toFixed(4);
        if (key !== beforeKey) hasMoved = true;
        stableFrames = (key === lastKey) ? stableFrames + 1 : 0;
        lastKey = key;
        totalFrames++;
        if ((hasMoved && stableFrames >= 4) || totalFrames > 90) {
            adjustForOverlap();
            return;
        }
        requestAnimationFrame(poll);
    }
    requestAnimationFrame(poll);
};

function assignDepths(node, depth = 0) {
    node._treeDepth = depth;
    if (node.children) node.children.forEach(c => assignDepths(c, depth + 1));
}
assignDepths(root, 0);

function walk(node, fn) {
    fn(node, node._treeDepth || 0);
    if (node.children) node.children.forEach(child => walk(child, fn));
}

let maxDepth = 0;
walk(root, (n, depth) => { if (depth > maxDepth) maxDepth = depth; });

const levelsContainer = document.getElementById('levels-container');
for (let i = 1; i <= maxDepth; i++) {
    const btn = document.createElement('button');
    btn.textContent = 'Level ' + i;
    btn.id = 'btn-lvl-' + i;
    btn.onclick = () => expandTo(i);
    levelsContainer.appendChild(btn);
}

function updateActiveButton(activeId) {
    document.querySelectorAll('.menu-left button').forEach(b => b.classList.remove('active'));
    if (activeId) {
        const activeBtn = document.getElementById(activeId);
        if (activeBtn) activeBtn.classList.add('active');
    }
}

window.expandAll = function() {
    walk(root, n => { n.payload = { ...n.payload, fold: 0 }; });
    window.mm.setData(root);
    updateActiveButton('btn-expand');
    currentLevel = maxDepth;
    saveState();
};

window.collapseAll = function() {
    expandTo(1);
    updateActiveButton('btn-collapse');
};

window.expandTo = function(level) {
    level = Math.max(1, Math.min(level, maxDepth));
    walk(root, (n, depth) => {
        n.payload = { ...n.payload, fold: depth >= level ? 1 : 0 };
    });
    window.mm.setData(root);
    updateActiveButton('btn-lvl-' + level);
    currentLevel = level;
    saveState();
};

window.toggleAutoFit = function() {
    autoFitEnabled = !autoFitEnabled;
    window.mm.setOptions({ autoFit: autoFitEnabled });
    const btn = document.getElementById('btn-autofit');
    btn.textContent = autoFitEnabled ? '🔄 AutoFit: ON' : '🔄 AutoFit: OFF';
    btn.classList.toggle('active', autoFitEnabled);
    saveState();
};

window.togglePitchMode = function() {
    isPitchMode = !isPitchMode;
    const btn = document.getElementById('btn-pitch');
    btn.classList.toggle('active', isPitchMode);
    if (isPitchMode) {
        btn.textContent = '📺 Pitch Mode: ON';
        if (!autoFitEnabled) {
            window.toggleAutoFit();
        }
        window.safeFit();
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
        }
    } else {
        btn.textContent = '📺 Pitch Mode';
        if (document.exitFullscreen && document.fullscreenElement) {
            document.exitFullscreen().catch(() => {});
        }
    }
};

window.changeNodeWidth = function(widthVal) {
    window.mm.setOptions({ maxWidth: parseInt(widthVal, 10) });
    window.mm.setData(root);
    window.safeFit();
    saveState();
};

window.toggleLinkAnimation = function() {
    linkAnimation = !linkAnimation;
    document.body.classList.toggle('animate-links', linkAnimation);
    document.getElementById('btn-flow').classList.toggle('active', linkAnimation);
    saveState();
};

window.exportPNG = function() {
    try {
        const svgEl = document.getElementById('markmap');
        const gEl = svgEl.querySelector('g');
        if (!gEl) return;
        const bbox = gEl.getBBox();
        const pad = 50;
        const x = bbox.x - pad;
        const y = bbox.y - pad;
        const w = Math.max(bbox.width + pad * 2, 300);
        const h = Math.max(bbox.height + pad * 2, 300);

        const clone = svgEl.cloneNode(true);
        clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        clone.setAttribute('viewBox', `${x} ${y} ${w} ${h}`);
        clone.setAttribute('width', w);
        clone.setAttribute('height', h);

        const bg = getComputedStyle(document.body).getPropertyValue('--bg-color').trim() || '#ffffff';
        clone.style.background = bg;
        const textColor = getComputedStyle(document.body).getPropertyValue('--node-text-color').trim() || '#000000';
        const ns = 'http://www.w3.org/2000/svg';

        clone.querySelectorAll('foreignObject').forEach(fo => {
            const div = fo.querySelector('div');
            const text = div ? div.textContent : '';
            const fx = parseFloat(fo.getAttribute('x') || '0');
            const fy = parseFloat(fo.getAttribute('y') || '0');
            const fh = parseFloat(fo.getAttribute('height') || '20');
            const textEl = document.createElementNS(ns, 'text');
            textEl.setAttribute('x', fx + 4);
            textEl.setAttribute('y', fy + fh / 2 + 5);
            textEl.setAttribute('font-size', '14');
            textEl.setAttribute('font-family', '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif');
            textEl.setAttribute('fill', textColor);
            textEl.textContent = text;
            fo.parentNode.replaceChild(textEl, fo);
        });

        const cloneG = clone.querySelector('g');
        if (cloneG) {
            cloneG.removeAttribute('transform');
        }

        const svgStr = new XMLSerializer().serializeToString(clone);
        const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);
        const img = new Image();
        img.onload = function() {
            try {
                const scale = 2;
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(w * scale);
                canvas.height = Math.round(h * scale);
                const ctx = canvas.getContext('2d');
                ctx.scale(scale, scale);
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, w, h);
                ctx.drawImage(img, 0, 0, w, h);
                canvas.toBlob(function(blob) {
                    if (!blob) return;
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = (document.title || 'mindmap').replace(/\s+/g, '_') + '.png';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                }, 'image/png');
            } catch (err) {
                console.error('PNG export drawing failed', err);
            } finally {
                URL.revokeObjectURL(url);
            }
        };
        img.onerror = function() {
            console.error('PNG rasterization failed');
            URL.revokeObjectURL(url);
        };
        img.src = url;
    } catch (e) {
        console.error('PNG export failed', e);
    }
};

document.getElementById('markmap').addEventListener('click', (e) => {
    const nodeGroup = e.target.closest('g.markmap-node');
    if (!nodeGroup) return;
    if (isPitchMode) {
        setTimeout(() => { window.safeFit(); }, 250);
    }
});

function applyTheme(theme) {
    document.body.setAttribute('data-theme', theme);
    const btn = document.getElementById('btn-theme');
    btn.textContent = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
    btn.classList.toggle('active', theme === 'dark');
    currentTheme = theme;
    saveState();
}
window.toggleTheme = function() { applyTheme(currentTheme === 'dark' ? 'light' : 'dark'); };

const storageKey = 'markmap_state_' + (location.pathname || document.title).replace(/[^a-z0-9_]/gi, '_');
function saveState() {
    try {
        localStorage.setItem(storageKey, JSON.stringify({
            level: currentLevel,
            width: document.getElementById('width-select').value,
            theme: currentTheme,
            autoFit: autoFitEnabled,
            flow: linkAnimation,
            palette: currentPalette,
            font: currentFont,
            fontSize: currentFontSize
        }));
    } catch (e) { /* skip persistence */ }
}
function loadState() {
    try {
        const raw = localStorage.getItem(storageKey);
        return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
}

window.toggleMobileMenu = function() {
    document.getElementById('menu').classList.toggle('mobile-open');
    document.getElementById('tools-menu').classList.toggle('mobile-open');
};

function collectMatches(query) {
    const q = query.trim().toLowerCase();
    const results = [];
    if (!q) return results;
    document.querySelectorAll('#markmap g.markmap-node .markmap-foreign > div').forEach(el => {
        if (el.textContent.toLowerCase().includes(q)) results.push(el);
    });
    return results;
}
function clearHighlights() {
    document.querySelectorAll('.search-match').forEach(el => el.classList.remove('search-match'));
}
function expandForQuery(query) {
    const q = query.trim().toLowerCase();
    let found = false;
    walk(root, n => {
        const text = (n.content || '').replace(/<[^>]+>/g, '').toLowerCase();
        if (text.includes(q)) found = true;
    });
    if (found) {
        walk(root, n => { n.payload = { ...n.payload, fold: 0 }; });
        window.mm.setData(root);
    }
    return found;
}
window.onSearchInput = function() {
    const query = document.getElementById('search-input').value;
    clearHighlights();
    const countEl = document.getElementById('search-count');
    if (!query.trim()) { countEl.textContent = ''; searchMatches = []; searchIndex = -1; return; }
    expandForQuery(query);
    setTimeout(() => {
        searchMatches = collectMatches(query);
        searchIndex = searchMatches.length ? 0 : -1;
        searchMatches.forEach(el => el.classList.add('search-match'));
        countEl.textContent = searchMatches.length ? '1/' + searchMatches.length : '0/0';
        if (searchMatches.length) window.safeFit();
    }, 250);
};
window.onSearchKeydown = function(e) {
    if (e.key === 'Escape') {
        document.getElementById('search-input').value = '';
        window.onSearchInput();
        document.getElementById('search-input').blur();
        return;
    }
    if (e.key !== 'Enter' || !searchMatches.length) return;
    e.preventDefault();
    searchIndex = e.shiftKey
        ? (searchIndex - 1 + searchMatches.length) % searchMatches.length
        : (searchIndex + 1) % searchMatches.length;
    document.getElementById('search-count').textContent = (searchIndex + 1) + '/' + searchMatches.length;
    window.safeFit();
};

function getSerializedSVG() {
    const svgEl = document.getElementById('markmap');
    const clone = svgEl.cloneNode(true);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    const bg = getComputedStyle(document.body).getPropertyValue('--bg-color').trim() || '#ffffff';
    clone.style.background = bg;
    return new XMLSerializer().serializeToString(clone);
}
window.exportSVG = function() {
    try {
        const svgStr = getSerializedSVG();
        const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = (document.title || 'mindmap').replace(/\s+/g, '_') + '.svg';
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
    } catch (e) { console.error('SVG export failed', e); }
};

document.addEventListener('keydown', function(e) {
    const tag = (e.target && e.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea';
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
        e.preventDefault();
        document.getElementById('search-input').focus();
        return;
    }
    if (e.key === 'Escape' && isPitchMode) { window.togglePitchMode(); return; }
    if (typing) return;
    if (e.key === '+' || e.key === '=') { expandTo(currentLevel + 1); }
    if (e.key === '-' || e.key === '_') { expandTo(currentLevel - 1); }
});

const savedState = loadState();
applyTheme((savedState && savedState.theme) || 'light');
if (savedState && savedState.width) {
    document.getElementById('width-select').value = savedState.width;
    window.mm.setOptions({ maxWidth: parseInt(savedState.width, 10) });
}
if (savedState && savedState.autoFit) { window.toggleAutoFit(); }
if (savedState && savedState.flow) { window.toggleLinkAnimation(); }
if (savedState && savedState.palette && savedState.palette !== currentPalette) {
    document.getElementById('palette-select').value = savedState.palette;
    window.changePalette(savedState.palette);
}
if (savedState && savedState.font && savedState.font !== currentFont) {
    document.getElementById('font-select').value = savedState.font;
    window.changeFont(savedState.font);
}
if (savedState && savedState.fontSize && savedState.fontSize !== currentFontSize) {
    document.getElementById('fontsize-select').value = savedState.fontSize;
    window.changeFontSize(savedState.fontSize);
}
expandTo(savedState && savedState.level ? savedState.level : 2);
window.safeFit();
</script>
</body>
</html>
